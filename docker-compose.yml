services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: sgact_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgact_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: database
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
      COOKIE_SECRET: app_cookie_secret
      SESSION_SECRET: app_session_secret
    ports:
      - "3000:3000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgact_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mariadb_data:
